<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDCAT Physics & Science Engine</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f4f7f6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); text-align: center; border-bottom: 2px solid var(--accent); padding-bottom: 10px; }
        .setup-box { background: #ebf5fb; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input[type="password"] { width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        button { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { opacity: 0.9; }
        .question-area { margin-top: 20px; display: none; }
        .option { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; background: white; transition: 0.3s; }
        .option:hover { background: #f0f0f0; }
        .correct { background: var(--success) !important; color: white; }
        .wrong { background: var(--error) !important; color: white; }
        #explanation { margin-top: 15px; padding: 15px; background: #e8f8f5; border-left: 5px solid var(--success); display: none; }
        .loading { font-style: italic; color: #7f8c8d; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>MDCAT Exam Engine</h1>
    
    <div class="setup-box" id="setup">
        <p>Enter your Gemini API Key to begin:</p>
        <input type="password" id="apiKey" placeholder="AIzaSy...">
        <button onclick="saveKey()">Start Session</button>
    </div>

    <div id="controls" style="display:none; text-align:center; margin-bottom: 20px;">
        <select id="subject">
            <option value="Physics">Physics (MDCAT Level)</option>
            <option value="Chemistry">Chemistry (MDCAT Level)</option>
            <option value="Biology">Biology (MDCAT Level)</option>
        </select>
        <button onclick="generateQuestion()">Generate New MCQ</button>
    </div>

    <div id="loading" class="loading" style="display:none;">Connecting to AI... Please wait.</div>

    <div id="question-area" class="question-area">
        <h3 id="q-text"></h3>
        <div id="options-container"></div>
        <div id="explanation"></div>
    </div>
</div>

<script>
    let currentKey = "";
    let correctAnswer = "";

    function saveKey() {
        currentKey = document.getElementById('apiKey').value;
        if (currentKey.length < 10) {
            alert("Please enter a valid API Key.");
            return;
        }
        document.getElementById('setup').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
    }

    async function generateQuestion() {
        const subject = document.getElementById('subject').value;
        const loader = document.getElementById('loading');
        const qArea = document.getElementById('question-area');
        const exp = document.getElementById('explanation');
        
        loader.style.display = 'block';
        qArea.style.display = 'none';
        exp.style.display = 'none';

        const prompt = `Generate a high-difficulty MDCAT ${subject} multiple-choice question. 
        Format as JSON: {"question": "...", "options": {"A": "...", "B": "...", "C": "...", "D": "..."}, "answer": "A/B/C/D", "explanation": "..."}`;

        try {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${currentKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
            });

            const data = await response.json();
            const text = data.candidates[0].content.parts[0].text;
            const cleanedText = text.replace(/```json|```/g, "");
            const mcq = JSON.parse(cleanedText);

            displayQuestion(mcq);
        } catch (error) {
            alert("Fetch Failed. Ensure your key is correct and you are using a Live Server (http://) rather than opening the file directly.");
            console.error(error);
        } finally {
            loader.style.display = 'none';
        }
    }

    function displayQuestion(mcq) {
        const qArea = document.getElementById('question-area');
        const qText = document.getElementById('q-text');
        const optContainer = document.getElementById('options-container');
        
        qText.innerText = mcq.question;
        optContainer.innerHTML = "";
        correctAnswer = mcq.answer;

        for (let key in mcq.options) {
            const btn = document.createElement('button');
            btn.className = 'option';
            btn.innerHTML = `<strong>${key}:</strong> ${mcq.options[key]}`;
            btn.onclick = () => checkAnswer(btn, key, mcq.explanation);
            optContainer.appendChild(btn);
        }

        qArea.style.display = 'block';
    }

    function checkAnswer(btn, choice, explanation) {
        const options = document.querySelectorAll('.option');
        options.forEach(opt => opt.disabled = true);

        if (choice === correctAnswer) {
            btn.classList.add('correct');
        } else {
            btn.classList.add('wrong');
            options.forEach(opt => {
                if (opt.innerText.startsWith(correctAnswer)) opt.classList.add('correct');
            });
        }

        const expBox = document.getElementById('explanation');
        expBox.innerHTML = `<strong>Explanation:</strong> ${explanation}`;
        expBox.style.display = 'block';
    }
</script>

</body>
</html>
